server {
    listen 80;
    listen [::]:80;
    server_name __ADP_SERVER_NAME__;
    root __ADP_RELEASE_PATH__/frontend/dist;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/lib/adp-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://__ADP_SERVER_NAME__$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __ADP_SERVER_NAME__;

    ssl_certificate __ADP_TLS_CERTIFICATE__;
    ssl_certificate_key __ADP_TLS_CERTIFICATE_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ADP_TLS:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root __ADP_RELEASE_PATH__/frontend/dist;
    index index.html;
    client_max_body_size 25m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location /api/ {
        proxy_pass http://127.0.0.1:__ADP_BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /api-docs {
        return 301 /api-docs/;
    }

    location /api-docs/ {
        root __ADP_RELEASE_PATH__;
        try_files $uri $uri/ /api-docs/index.html;
    }

    location / {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
