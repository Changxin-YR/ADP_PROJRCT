# Include this file inside the existing TLS server for 23331.cloud.
# It owns only /adp/ and /adp/api/; the other projects keep their existing paths.
location = __ADP_PUBLIC_PREFIX__ {
    if ($host != __ADP_SERVER_NAME__) { return 444; }
    return 301 __ADP_PUBLIC_PATH__;
}

location = __ADP_PUBLIC_PREFIX__/healthz {
    if ($host != __ADP_SERVER_NAME__) { return 444; }
    access_log off;
    default_type text/plain;
    return 200 'ok\n';
}

location ^~ __ADP_PUBLIC_PREFIX__/api/ {
    if ($host != __ADP_SERVER_NAME__) { return 444; }
    rewrite ^__ADP_PUBLIC_PREFIX__/api/(.*)$ /api/$1 break;
    proxy_pass http://127.0.0.1:__ADP_BACKEND_PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 智能体单轮可能跑 60-90s（多次工具调用）；比后端 AGENT_REQUEST_TIMEOUT_SECONDS 留出余量。
    proxy_read_timeout 150s;
}

location = __ADP_PUBLIC_PREFIX__/api-docs {
    if ($host != __ADP_SERVER_NAME__) { return 444; }
    return 301 __ADP_PUBLIC_PREFIX__/api-docs/;
}

location = __ADP_PUBLIC_PREFIX__/api-docs/ {
    if ($host != __ADP_SERVER_NAME__) { return 444; }
    root __ADP_RELEASE_PATH__;
    rewrite ^__ADP_PUBLIC_PREFIX__/api-docs/$ /api-docs/index.html break;
}

location ^~ __ADP_PUBLIC_PREFIX__/api-docs/ {
    if ($host != __ADP_SERVER_NAME__) { return 444; }
    rewrite ^__ADP_PUBLIC_PREFIX__/api-docs/(.*)$ /api-docs/$1 break;
    root __ADP_RELEASE_PATH__;
    index index.html;
    try_files $uri $uri/ __ADP_PUBLIC_PREFIX__/api-docs/index.html;
}

location = __ADP_PUBLIC_PREFIX__/ {
    if ($host != __ADP_SERVER_NAME__) { return 444; }
    root __ADP_RELEASE_PATH__/frontend/dist;
    try_files /index.html =404;
}

location ^~ __ADP_PUBLIC_PATH__ {
    if ($host != __ADP_SERVER_NAME__) { return 444; }
    rewrite ^__ADP_PUBLIC_PREFIX__/(.*)$ /$1 break;
    root __ADP_RELEASE_PATH__/frontend/dist;
    index index.html;
    try_files $uri $uri/ __ADP_PUBLIC_PREFIX__/index.html;
}
