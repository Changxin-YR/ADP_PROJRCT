# ADP gateway tools. The sidecar supplies these values for each process.
- insert:
    - id: adp-agent-tools
      name: '@deepseek-ai/dsh-adp-agent-tools'
      config:
        gatewayUrl: !!js process.env.ADP_AGENT_GATEWAY_URL ?? ''
        contextToken: !!js process.env.ADP_AGENT_CONTEXT_TOKEN ?? ''
